# x30_mapping defaults on the X30, one section per node: loaded at the launch namespace (a
# params_file has the same layout). Every parameter: README.md. The robot (frames, footprint,
# base_height, limits) comes from the robot profile (robot/); sites_dir is shared by the three
# nodes (and x30_localization): the launch argument sets it for all of them.
grid_mapper_node:
  cloud_topic: /cloud_registered_body   # FAST-LIO's deskewed scan in its body frame
  rate_hz: 2.0                  # scans integrated per second (the newest one each time)
  grid:
    resolution: 0.05
    max_size_m: 150.0           # cap per side: 3000 x 3000 cells = 36 MB; hits beyond are dropped
  scan:
    # obstacle band above the floor in the map frame (floor = base_link height minus
    # robot base_height); localization levels odom with the IMU, so a pitching body never
    # turns the floor into walls
    height_min: 0.05
    height_max: 1.5
    max_range: 15.0
  gate:
    max_jump_m: 0.5             # plus max speed * dt: more is a pose jump, integration holds
    correction_window_sec: 0.5  # scans while map->odom changes around them are skipped
  refine:
    enabled: false              # scan-to-map refinement of the TF pose, gated (README.md)

site_manager_node:
  site: ""                      # site loaded at start; empty: the one of the last run
  start_mapping: false          # true (mapping mode): map `site` at start when it is new

route_recorder_node:
  min_spacing_m: 0.2            # a waypoint after this much motion
  output_path: ""               # routes while no site is active; empty: refuse
