# x30_mapping defaults on the X30, one section per node: loaded at the launch namespace (a
# params_file has the same layout). Every parameter: README.md. The robot (frames, footprint,
# limits) comes from the robot profile (robot/); sites_dir is shared by both nodes (and
# x30_localization, x30_navigation): the launch argument sets it for all of them. A site is a
# folder of routes and tags in the frame of the odometry's start: no map.
site_manager_node:
  site: ""                      # site loaded at start; empty: the one of the last run
  create_site: true             # create `site` at start when it is missing

route_recorder_node:
  min_spacing_m: 0.2            # a waypoint after this much motion
  output_path: ""               # routes while no site is active; empty: refuse
